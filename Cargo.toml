[package]
name = "anti-uprobe-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Anti-uprobe integrity: compare in-memory .text against the on-disk ELF"
repository = "https://github.com/federiconbaez/cortex9-anti-uprobe-guard"
authors = ["Federico Nicolas Báez Rizzo"]
publish = false
default-run = "anti-uprobe-guard"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "anti-uprobe-guard"
path = "src/main.rs"

[[bin]]
name = "anti-uprobe-enforce"
path = "src/bin/anti-uprobe-enforce.rs"

[lib]
name = "anti_uprobe_guard"
path = "src/lib.rs"

[profile.release]
lto = false
codegen-units = 16
